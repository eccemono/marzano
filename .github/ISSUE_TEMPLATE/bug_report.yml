name: Bug report
description: Something in Marzano is not behaving as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste tokens, `.env` contents, or
        private Discord content - see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour, including any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure a channel with `/pomodoro configure`
        2. Start a session with `/pomodoro start`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Marzano version
      description: Output of `/info`, or the commit SHA you are running.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`. Must be 22.x.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timer or stage transitions
        - Voice or audio
        - Slash commands or configuration
        - Restart or recovery behaviour
        - CI or tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted log lines only. Marzano redacts credentials, but check before pasting.
    validations:
      required: false
